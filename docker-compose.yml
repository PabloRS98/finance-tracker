# Despliegue autónomo: esta app se levanta sola, sin depender de ninguna otra.
# Antes formaba parte de la suite "home-apps-suite" y arrancaba junto a
# media-catalog; ahora cada aplicación tiene su propio ciclo de vida.
name: finance-tracker

services:
  finance-tracker:
    build: .
    container_name: finance-tracker
    restart: unless-stopped
    ports:
      # Solo loopback por defecto. Antes se publicaba fijo en 0.0.0.0 porque la
      # app se usa a diario desde el móvil en la LAN; el problema es que esa
      # comodidad venía de serie, combinada con la autenticación desactivada y
      # sin nada que impidiera arrancar con la contraseña de fábrica. Cualquiera
      # en la misma Wi-Fi leía y escribía el patrimonio entero.
      #
      # Para volver a llegar desde el móvil: FINANCE_BIND=0.0.0.0 en el .env,
      # y entonces ENABLE_AUTH=true con una contraseña de verdad (el validador
      # de app/config.py no deja arrancar con la de fábrica).
      - "${FINANCE_BIND:-127.0.0.1}:${FINANCE_PORT:-8001}:8000"
    env_file:
      # Opcional: sin .env la app arranca con los valores por defecto de
      # app/config.py (sin autenticación, sin Telegram). Copia .env.example.
      - path: .env
        required: false
    environment:
      # Ruta fija dentro del contenedor: siempre apunta al volumen de datos,
      # así que no debe poder sobrescribirse desde el .env del host.
      - DB_PATH=/data/finance.db
    volumes:
      - finance_data:/data
    healthcheck:
      # La suite definía el healthcheck por fuera; al independizarse hay que
      # declararlo aquí o el contenedor pasaría a no tener ninguno.
      #
      # /salud consulta la base de datos y devuelve 503 si no puede servir
      # páginas. `urlopen` lanza HTTPError con cualquier código que no sea 2xx,
      # así que ese 503 marca el contenedor como unhealthy: es lo que faltaba
      # cuando la app estuvo semanas "healthy" devolviendo 500 en todas partes.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  finance_data:
    # Nombre fijado a propósito: sin esto Compose lo prefija con el nombre del
    # proyecto, y renombrar la carpeta apuntaría a un volumen vacío, con la
    # base de datos aparentemente "desaparecida".
    name: finance-tracker_data
