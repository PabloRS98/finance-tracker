[pytest]
# La raíz del repo tiene que estar en sys.path para poder importar "app":
# pytest solo añade el directorio donde vive el conftest (tests/), así que
# "pytest" a secas fallaba con ModuleNotFoundError aunque "python -m pytest"
# funcionara, porque ese sí mete el directorio actual. Es lo que tenía el CI
# en rojo.
pythonpath = .
testpaths = tests
