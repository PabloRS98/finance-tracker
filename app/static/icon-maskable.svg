<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Icono "maskable": el lanzador de Android le aplica su propia máscara (círculo,
     squircle...), así que el fondo va a sangre y SIN esquinas redondeadas propias,
     y el dibujo se queda dentro de la zona segura (el 80% central). Con el icono
     normal, Android lo mete dentro de un cuadro blanco y queda como una pegatina. -->
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#2f6ad9"/></linearGradient></defs>
<rect width="64" height="64" fill="url(#g)"/>
<g transform="translate(20,20) scale(1.0)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" /><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" /></g>
</svg>
