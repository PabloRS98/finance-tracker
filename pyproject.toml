[tool.ruff]
# 110 igual que projects-dashboard. El fichero más largo de esta app ya escribe
# a ese ancho, así que bajar el límite obligaría a reformatear código que no
# está en ningún hallazgo.
line-length = 110
target-version = "py312"
exclude = ["app/static", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "B008",   # Depends(...) como valor por defecto es el idioma de FastAPI
    "UP031",  # el formato con % es el estilo consistente del proyecto
]

[tool.ruff.lint.per-file-ignores]
# El módulo abre con un bloque largo que explica por qué existen estos tests, y
# los imports van detrás a propósito: el porqué se lee antes que el cómo.
"tests/test_sistema_visual.py" = ["E402"]
