name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    # Job propio y no un paso dentro de pytest: un fallo de estilo y un test
    # roto son cosas distintas, y verlos separados dice de un vistazo cuál de
    # las dos ha pasado. Mismo criterio que el job de auditoría.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ruff
        # Solo el linter: no hace falta la app entera para leer el código.
        run: pip install -r requirements-dev.txt

      - name: Estilo
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # faster-whisper y pymupdf solo hacen falta para voz/PDF en runtime y
        # pesan mucho: los tests que los tocan los parchean, así que fuera del CI.
        run: |
          grep -v -E '^(faster-whisper|pymupdf)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt pytest

      - name: Tests
        # DB_PATH fuera de /data: el runner no tiene el volumen del contenedor
        env:
          DB_PATH: ${{ runner.temp }}/finance-ci.db
        run: pytest -q

  auditoria:
    # Corre aparte de los tests: que una dependencia tenga un CVE no significa
    # que el código esté roto, y verlo en un check propio dice de un vistazo
    # cuál de las dos cosas ha pasado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Vulnerabilidades conocidas en las dependencias
        # Se auditan las versiones declaradas, sin instalarlas: es lo que se va
        # a desplegar, y evita bajarse faster-whisper entero para mirar un
        # fichero de texto.
        run: pip-audit -r requirements.txt --progress-spinner off
