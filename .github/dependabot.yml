# Las dependencias van pinneadas, que está bien, pero sin nadie que las suba se
# quedan congeladas: se dejaron dos años sin tocar y acumularon 19
# vulnerabilidades conocidas, tres de ellas en el camino de cada petición HTTP.
#
# Agrupadas en un solo PR semanal a propósito: once dependencias sueltas serían
# once PRs que nadie mira, y el CI ya construye la imagen y la levanta, así que
# un grupo entero se valida de una vez. Los saltos de versión mayor van aparte,
# porque esos sí hay que leerlos.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      # Sin prefijos tipo Conventional Commits: no se usan en este repo.
      prefix: "Actualizar"
    groups:
      menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # El propio CI: una acción abandonada es tan problema como una librería vieja.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Actualizar"
